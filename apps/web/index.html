<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="voicelab: hands-free, SOP-aware voice assistant for the lab bench." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2337d6b4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 3h6M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3'/%3E%3Cpath d='M7 15h10'/%3E%3C/svg%3E"
    />
    <title>voicelab</title>
    <script>
      // Apply the saved theme before first paint (avoids a light flash in a dark hood).
      try {
        var p = JSON.parse(localStorage.getItem("voicelab.prefs.v1") || "{}");
        if (p.theme === "light" || p.theme === "dark") document.documentElement.dataset.theme = p.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>voicelab needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
